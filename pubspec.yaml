name: car_rental_app
description: "A new Flutter project."

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.8.1


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  # An SVG rendering and widget library for Flutter, which allows painting
  flutter_svg: ^2.2.0
  # Package handles the pagination and search in DropDown 
  high_q_paginated_drop_down: ^2.1.3
  # help you to generate pin code fields. Can be useful for OTP for example.
  pin_code_fields: ^8.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

 
  flutter_lints: ^5.0.0


flutter:


  uses-material-design: true


  assets:
    - assets/images/
    - assets/svg/
    

  
  # example:
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/font/Roboto-SemiBold.ttf
        - asset: assets/font/Roboto-Regular.ttf
        - asset: assets/font/Roboto-Bold.ttf
          
    
  
  
